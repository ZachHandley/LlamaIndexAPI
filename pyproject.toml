[project]
name = "LlamaIndexAPI"
version = "0.0.1"
description = "A FastAPI starter point for Llama Index projects"
authors = [
    { name = "Zachary Handley", email = "zach@zachhandley.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
keywords = ["ai", "docker", "python", "llama-index", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Modern LlamaIndex packages (modular structure)
    "llama-index-core>=0.12.0",
    "llama-index-llms-openai>=0.3.0",
    "llama-index-multi-modal-llms-openai>=0.3.0",
    "llama-index-vector-stores-qdrant>=0.4.0",
    "llama-index-embeddings-openai>=0.3.0",
    "llama-index-readers-file>=0.3.0",
    # Core dependencies
    "anthropic>=0.39.0",
    "appwrite>=6.0.0",
    "requests>=2.32.0",
    "pypdf>=5.1.0",
    "lxml>=5.3.0",
    "sentence-transformers>=3.3.0",
    "uvicorn[standard]>=0.32.0",
    "gunicorn>=23.0.0",
    "trafilatura>=2.0.0",
    "torch>=2.5.0",
    "nest-asyncio>=1.6.0",
    "fastapi>=0.115.0",
    "langchain>=0.3.0",
    "ftfy>=6.3.0",
    "regex>=2024.11.6",
    "tqdm>=4.67.0",
    "matplotlib>=3.9.0",
    "scikit-image>=0.24.0",
    "torchvision>=0.20.0",
    "qdrant-client>=1.12.0",
    "pillow>=11.0.0",
    "aiohttp>=3.11.0",
    "python-dotenv>=1.0.0",
    "openai>=1.54.0",
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "typing-inspect>=0.9.0",
    "types-requests>=2.32.0",
    "isort>=5.13.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "coverage>=7.6.0",
    "black>=24.10.0",
    "pre-commit>=4.0.0",
    "pylint>=3.3.0",
    "testcontainers>=4.8.0",
    "bcrypt>=4.2.0",
]

[project.urls]
Homepage = "https://zachhandley.com"
Repository = "https://github.com/zachhandley/LlamaIndexAPI"

# https://docs.pytest.org/en/latest/reference/customize.html
[tool.pytest.ini_options]
addopts = "--ignore=tests/functionality/test_worker_reload.py"
testpaths = ["tests"]

# https://black.readthedocs.io/en/stable/usage_and_configuration/the_basics.html#configuration-via-a-file
[tool.black]
line-length = 80
target-version = ['py311']

[tool.pylint.main]
errors-only = true
recursive = "y"

[tool.isort]
profile = "black"
line_length = 80

[tool.uv]
dev-dependencies = [
    "typing-inspect>=0.9.0",
    "types-requests>=2.32.0",
    "isort>=5.13.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "coverage>=7.6.0",
    "black>=24.10.0",
    "pre-commit>=4.0.0",
    "pylint>=3.3.0",
    "testcontainers>=4.8.0",
    "bcrypt>=4.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
